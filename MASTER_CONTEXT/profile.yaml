      entry: src/subagents/trident-bug-hunter/harness/report.ts
      contract: "THE SEALED REPORT OPENS WITH THE REPORT TITLE AND CONTAINS ZERO META-COMMENTARY - ZERO RULES COMPILED OR ZERO COVERAGE IS INCONCLUSIVE NOT CLEAN"
